<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide des plantes médicinales</title>
<meta name="description" content="Guide d'utilisation des plantes médicinales — ONG Save Our Planet, projet JARCOMED. Consultation en ligne uniquement.">
<style>
  :root { --bg:#eef2ea; --ink:#1f2a1c; --accent:#2f6b3a; --card:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a13; --ink:#e4ecdf; --accent:#7cc48a; --card:#1d251c; } }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  header { position:sticky; top:0; z-index:10; background:var(--accent); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0; font-weight:600; }
  header span { font-size:.85rem; opacity:.9; }
  main { max-width:900px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
  .page { position:relative; background:var(--card); box-shadow:0 2px 10px rgba(0,0,0,.15); aspect-ratio:595.5/842.25; background-size:100% 100%; background-repeat:no-repeat; }
  .page::after { content:"© ONG SAVE OUR PLANET — consultation en ligne uniquement"; position:absolute; inset:auto 0 8px 0; text-align:center; font-size:11px; color:rgba(0,0,0,.35); pointer-events:none; }
  .num { position:absolute; top:8px; right:10px; font-size:12px; background:rgba(0,0,0,.45); color:#fff; padding:2px 8px; border-radius:10px; }
  footer { text-align:center; font-size:.8rem; padding:24px 16px; opacity:.75; }
  @media print { body * { display:none !important; } body::before { content:"L'impression de ce guide n'est pas autorisée."; display:block; padding:40px; } }
</style>
</head>
<body>
<header>
  <h1>Guide d'utilisation des plantes médicinales</h1>
  <span>ONG Save Our Planet · Projet JARCOMED</span>
</header>
<main id="pages"></main>
<footer>© ONG Save Our Planet — Ce guide est proposé en consultation en ligne uniquement. Toute reproduction ou diffusion est interdite sans autorisation.</footer>
<script>
  var TOTAL = 36, main = document.getElementById('pages');
  // Pages are CSS backgrounds (not <img>) so "Save image as" is not offered; loaded lazily as they approach the viewport.
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.style.backgroundImage = 'url(' + e.target.dataset.src + ')'; io.unobserve(e.target); }
    });
  }, { rootMargin: '800px 0px' });
  for (var i = 1; i <= TOTAL; i++) {
    var d = document.createElement('div');
    d.className = 'page';
    d.dataset.src = 'pages/p' + (i < 10 ? '0' + i : i) + '.jpg';
    d.innerHTML = '<span class="num">' + i + ' / ' + TOTAL + '</span>';
    main.appendChild(d);
    io.observe(d);
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p' || k === 'u')) e.preventDefault();
  });
</script>
</body>
</html>
